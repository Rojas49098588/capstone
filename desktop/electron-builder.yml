# Builds the installers: npm run dist (builds web/ first) makes the Windows .exe on Windows and the
# universal Mac .dmg on a Mac; the "Build installers" GitHub workflow runs it on both. scripts/dist.js sets the output
# folder outside OneDrive (~/StudiumBuilds); `release` is only the fallback for a direct electron-builder run.
# The paths under extraResources are where src/main/paths.js looks in a packaged build.
appId: edu.smu.studium
productName: Studium
directories:
  output: release
files:
  - src/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web
  - from: ../extension/content
    to: extension/content
    filter: ['*.js']
  - from: ../extension/assets/sounds
    to: extension/assets/sounds
  - from: ../extension/assets/pets
    to: extension/assets/pets
  - from: src/overlay
    to: overlay
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.productivity
  # Signed with the Developer ID certificate (CSC_LINK / CSC_KEY_PASSWORD) and notarized by Apple
  # (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID): GitHub secrets the workflow passes to the Mac build.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  artifactName: Studium-${version}-mac.${ext}
dmg:
  title: Studium ${version}
nsis:
  artifactName: Studium-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
